<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Extract a vertical color palette from a PNG image">
  <title>Color Palette Extractor</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #ff8a00;
      background: #000000;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 42px 28px 56px;
      background: #000000;
      color: #ff8a00;
    }

    header {
      display: flex;
      justify-content: center;
      margin-bottom: 54px;
    }

    h1 {
      margin: 0;
      color: #ff8a00;
      font-size: clamp(25px, 4vw, 34px);
      font-weight: 650;
      letter-spacing: -1.2px;
      text-align: center;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 22px;
      width: min(100%, 940px);
      margin: 0 auto;
    }

    .panel {
      min-height: 470px;
      padding: 26px;
      border: 1px solid #242424;
      border-radius: 12px;
      background: #000000;
    }

    .drop-area {
      display: flex;
      min-height: 416px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      border: 1px dashed #ff8a00;
      border-radius: 8px;
      background: #000000;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .drop-area.is-over {
      border-color: #ffad42;
      background: #101010;
    }

    .button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 0 17px;
      border: 1px solid #ff8a00;
      border-radius: 6px;
      background: #555555;
      color: #ff8a00;
      font: inherit;
      font-size: 13px;
      font-weight: 550;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease, opacity 150ms ease;
    }

    .button:hover:not(:disabled) {
      border-color: #ffad42;
      background: #686868;
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .palette-panel {
      display: flex;
      flex-direction: column;
    }

    .palette-content {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 330px;
      padding: 20px 0;
    }

    .palette-image {
      display: block;
      width: 100px;
      max-height: 300px;
      object-fit: contain;
      image-rendering: pixelated;
      border: 1px solid #333333;
      border-radius: 3px;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      padding-top: 18px;
      border-top: 1px solid #242424;
    }

    input[type="file"] {
      display: none;
    }

    @media (max-width: 700px) {
      body {
        padding: 30px 16px 36px;
      }

      header {
        margin-bottom: 32px;
      }

      main {
        grid-template-columns: 1fr;
        gap: 16px;
        max-width: 470px;
      }

      .panel {
        min-height: 0;
        padding: 22px;
      }

      .drop-area {
        min-height: 270px;
      }

      .palette-content {
        min-height: 260px;
      }

      .palette-image {
        max-height: 240px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Color Palette Extractor</h1>
  </header>

  <main>
    <section class="panel" aria-label="PNG upload">
      <div class="drop-area" id="drop-area" tabindex="0" role="button" aria-label="PNG upload area">
        <button class="button" id="upload-button" type="button">Choose PNG</button>
      </div>
      <input id="file-input" type="file" accept="image/png,.png">
    </section>

    <section class="panel palette-panel" aria-label="Extracted color palette">
      <div class="palette-content" id="palette-content"></div>
      <div class="actions">
        <button class="button" id="copy-button" type="button" disabled>Copy to clipboard</button>
        <button class="button" id="download-button" type="button" disabled>Download</button>
      </div>
    </section>
  </main>

  <script>
    const fileInput = document.getElementById('file-input');
    const uploadButton = document.getElementById('upload-button');
    const dropArea = document.getElementById('drop-area');
    const paletteContent = document.getElementById('palette-content');
    const copyButton = document.getElementById('copy-button');
    const downloadButton = document.getElementById('download-button');

    let paletteBlob = null;
    let paletteUrl = null;
    let paletteCount = 0;

    uploadButton.addEventListener('click', () => fileInput.click());

    dropArea.addEventListener('click', event => {
      if (event.target !== uploadButton) fileInput.click();
    });

    dropArea.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        fileInput.click();
      }
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) processFile(fileInput.files[0]);
      fileInput.value = '';
    });

    ['dragenter', 'dragover'].forEach(type => {
      dropArea.addEventListener(type, event => {
        event.preventDefault();
        dropArea.classList.add('is-over');
      });
    });

    ['dragleave', 'drop'].forEach(type => {
      dropArea.addEventListener(type, event => {
        event.preventDefault();
        dropArea.classList.remove('is-over');
      });
    });

    dropArea.addEventListener('drop', event => {
      const file = Array.from(event.dataTransfer.files).find(isPngFile);
      if (file) processFile(file);
    });

    document.addEventListener('paste', event => {
      const items = Array.from(event.clipboardData?.items || []);
      const imageItem = items.find(item => item.type === 'image/png');
      if (!imageItem) return;
      const file = imageItem.getAsFile();
      if (file) processFile(file);
    });

    function isPngFile(file) {
      return file.type === 'image/png' || file.name.toLowerCase().endsWith('.png');
    }

    function processFile(file) {
      if (!isPngFile(file)) {
          return;
      }

      const imageUrl = URL.createObjectURL(file);
      const image = new Image();

      image.onload = () => {
        try {
          const colors = extractColors(image);
          createPalette(colors);
          } catch (error) {
        } finally {
          URL.revokeObjectURL(imageUrl);
        }
      };

      image.onerror = () => {
        URL.revokeObjectURL(imageUrl);
      };

      image.src = imageUrl;
    }

    function extractColors(image) {
      const scale = Math.min(1, 120 / Math.max(image.naturalWidth, image.naturalHeight));
      const width = Math.max(1, Math.round(image.naturalWidth * scale));
      const height = Math.max(1, Math.round(image.naturalHeight * scale));
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d', { willReadFrequently: true });
      canvas.width = width;
      canvas.height = height;
      context.drawImage(image, 0, 0, width, height);

      const pixels = context.getImageData(0, 0, width, height).data;
      const buckets = new Map();

      for (let index = 0; index < pixels.length; index += 4) {
        const alpha = pixels[index + 3] / 255;
        if (alpha < 0.5) continue;

        const red = Math.round(pixels[index] * alpha + 255 * (1 - alpha));
        const green = Math.round(pixels[index + 1] * alpha + 255 * (1 - alpha));
        const blue = Math.round(pixels[index + 2] * alpha + 255 * (1 - alpha));
        const key = `${red >> 3},${green >> 3},${blue >> 3}`;
        const bucket = buckets.get(key) || { red: 0, green: 0, blue: 0, count: 0 };

        bucket.red += red;
        bucket.green += green;
        bucket.blue += blue;
        bucket.count += 1;
        buckets.set(key, bucket);
      }

      if (buckets.size === 0) return [[255, 255, 255]];

      return Array.from(buckets.values())
        .sort((a, b) => b.count - a.count)
        .slice(0, 8)
        .map(bucket => [
          Math.round(bucket.red / bucket.count),
          Math.round(bucket.green / bucket.count),
          Math.round(bucket.blue / bucket.count)
        ]);
    }

    function createPalette(colors) {
      const swatchHeight = 48;
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      canvas.width = 160;
      canvas.height = swatchHeight * colors.length;

      colors.forEach((color, index) => {
        context.fillStyle = `rgb(${color[0]} ${color[1]} ${color[2]})`;
        context.fillRect(0, index * swatchHeight, canvas.width, swatchHeight);
      });

      canvas.toBlob(blob => {
        if (!blob) {
          return;
        }

        paletteBlob = blob;
        paletteCount = colors.length;

        if (paletteUrl) URL.revokeObjectURL(paletteUrl);
        paletteUrl = URL.createObjectURL(blob);

        const preview = document.createElement('img');
        preview.className = 'palette-image';
        preview.src = paletteUrl;
        preview.alt = `Vertical color palette with ${colors.length} colors`;

        paletteContent.replaceChildren(preview);
        copyButton.disabled = false;
        downloadButton.disabled = false;
      }, 'image/png');
    }

    copyButton.addEventListener('click', async () => {
      if (!paletteBlob) return;

      try {
        if (!navigator.clipboard || typeof ClipboardItem === 'undefined') {
          throw new Error('Clipboard image support is unavailable');
        }
        await navigator.clipboard.write([
          new ClipboardItem({ 'image/png': paletteBlob })
        ]);
      } catch (error) {
      }
    });

    downloadButton.addEventListener('click', () => {
      if (!paletteUrl) return;
      const link = document.createElement('a');
      link.href = paletteUrl;
      link.download = 'color-palette.png';
      document.body.appendChild(link);
      link.click();
      link.remove();
    });

  </script>
</body>
</html>
